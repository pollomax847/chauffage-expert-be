<!DOCTYPE html>
<html>

<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description"
        content="Application professionnelle pour les techniciens chauffagistes et bureaux d'études">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Chauffage Expert">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Chauffage Expert BE</title>
    <link rel="manifest" href="manifest.json">

    <script>
        // The value below is injected by flutter build, do not touch.
        const serviceWorkerVersion = "1176991173";
    </script>
    <!-- This script adds the flutter initialization JS code -->
    <script src="flutter.js" defer></script>
    <style>
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Chargement de l'application...</p>
    </div>
    <script>
        window.addEventListener('load', async function () {
            try {
                // Initialize Flutter
                await _flutter.loader.load();

                // Download main.dart.js
                const entrypoint = await _flutter.loader.load({
                    serviceWorker: {
                        serviceWorkerVersion: serviceWorkerVersion,
                    }
                });

                // Initialize the app
                await entrypoint.initializeEngine();
                await entrypoint.runApp();

                // Hide loading screen when app is ready
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error loading Flutter application:', error);
                document.getElementById('loading').innerHTML = 
                    '<p style="color: red;">Erreur de chargement. Veuillez rafraîchir la page.</p>';
            }
        });
    </script>
</body>

</html>
