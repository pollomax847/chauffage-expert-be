<!DOCTYPE html>
<html>

<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description"
        content="Application professionnelle pour les techniciens chauffagistes et bureaux d'études">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Chauffage Expert">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Chauffage Expert BE</title>
    <link rel="manifest" href="manifest.json">

    <script>
        // The value below is injected by flutter build, do not touch.
        const serviceWorkerVersion = "1176991173";
    </script>
    <!-- This script adds the flutter initialization JS code -->
    <script src="flutter.js" defer></script>
    <style>
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #error-message {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Chargement de l'application...</p>
        <div id="error-message"></div>
    </div>
    <script>
        function showError(message) {
            console.error(message);
            const errorDiv = document.getElementById('error-message');
            errorDiv.innerHTML = message;
            errorDiv.style.display = 'block';
        }

        window.addEventListener('load', function () {
            console.log('Page loaded, initializing Flutter...');
            
            try {
                _flutter.loader.load({
                    serviceWorker: {
                        serviceWorkerVersion: serviceWorkerVersion,
                    },
                    onEntrypointLoaded: function(engineInitializer) {
                        console.log('Flutter engine initializer loaded');
                        engineInitializer.initializeEngine().then(function(appRunner) {
                            console.log('Flutter engine initialized');
                            appRunner.runApp();
                            document.getElementById('loading').style.display = 'none';
                        }).catch(function(error) {
                            showError('Erreur lors de l\'initialisation de Flutter: ' + error);
                            console.error('Error initializing Flutter:', error);
                        });
                    }
                });
            } catch (error) {
                showError('Erreur lors du chargement de Flutter: ' + error);
                console.error('Error loading Flutter:', error);
            }
        });
    </script>
</body>

</html>
